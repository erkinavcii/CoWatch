<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Co-Watch</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">Co<span>·</span>Watch</div>
    <div class="film-title" id="filmTitle"></div>
    <div class="members" id="members"></div>
    <span class="conn" id="conn"></span>
    <select id="uiLang" class="lang-select" aria-label="Language"></select>
  </header>

  <main class="layout">
    <div class="watch" id="watch">
    <div class="stage-wrap" id="stageWrap">
    <div class="away-msg" id="awayMsg" hidden>
      <p data-i18n="pip_away"></p>
      <button type="button" id="pipReturn" data-i18n="pip_return"></button>
    </div>
    <div class="stage" id="stage">
      <button type="button" class="mini-back" id="miniBack" data-i18n-title="mini_back"></button>
      <button type="button" class="mini-close" id="miniClose" data-i18n-title="mini_close">✕</button>
      <video id="video" playsinline preload="auto"></video>
      <video id="screenVideo" class="screen-video" playsinline hidden></video>
      <div class="subs" id="subs">
        <div class="sub secondary" id="subSecondary" hidden></div>
        <div class="sub primary" id="subPrimary" hidden></div>
      </div>
      <div class="empty" id="empty"><p data-i18n="no_media"></p></div>
      <canvas class="draw" id="drawCanvas"></canvas>
      <div class="cursors" id="cursors"></div>
      <div class="center-msg" id="centerMsg" hidden></div>
      <div class="screen-tag" id="screenTag" hidden></div>
      <div class="share-asks" id="shareAsks" hidden></div>
      <ol class="chat-peek" id="chatPeek" aria-live="polite"></ol>
      <div class="chat" id="chatBox" hidden>
        <div class="chat-head">
          <span data-i18n="chat_title"></span>
          <button type="button" id="chatClose" class="chat-close" data-i18n-title="chat_close">✕</button>
        </div>
        <ol class="chat-log" id="chatLog"></ol>
        <form class="chat-form" id="chatForm">
          <input id="chatInput" maxlength="500" autocomplete="off" enterkeyhint="send" data-i18n-placeholder="chat_placeholder">
          <button type="submit" class="primary" data-i18n="chat_send"></button>
        </form>
      </div>
      <div class="side left" id="sideLeft"></div>
      <div class="side right" id="sideRight">
      <div class="cams-box" id="camsBox" hidden>
        <button type="button" class="cams-size" id="camsSizeBtn">
          <svg class="i-small" viewBox="0 0 24 24"><path d="M5 11h14v2H5z"/></svg>
          <svg class="i-big" viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
        </button>
        <div class="cams" id="cams"></div>
      </div>
      <div class="toolbar" id="toolbar">
        <button type="button" id="penBtn" class="tool" data-i18n-title="tool_pen">
          <svg viewBox="0 0 24 24"><path d="M3.5 20.5l1.3-5L15.6 4.7a1.8 1.8 0 0 1 2.5 0l1.2 1.2a1.8 1.8 0 0 1 0 2.5L8.5 19.2z"/></svg>
        </button>
        <button type="button" id="colorBtn" class="tool" data-i18n-title="tool_color"><span class="dot"></span></button>
        <div class="palette" id="palette" hidden></div>
        <button type="button" id="clearBtn" class="tool" data-i18n-title="tool_clear">
          <svg viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4zM6 9h12l-1 11.2A2 2 0 0 1 15 22H9a2 2 0 0 1-2-1.8z"/></svg>
        </button>
        <button type="button" id="sfxBtn" class="tool" data-i18n-title="tool_sfx">
          <svg class="i-on" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-6 6v4.5L4 17v1h16v-1l-2-3.5V9a6 6 0 0 0-6-6zm-2.2 16a2.2 2.2 0 0 0 4.4 0z"/></svg>
          <svg class="i-off" viewBox="0 0 24 24"><path opacity=".4" d="M12 3a6 6 0 0 0-6 6v4.5L4 17v1h16v-1l-2-3.5V9a6 6 0 0 0-6-6zm-2.2 16a2.2 2.2 0 0 0 4.4 0z"/><path d="M4.4 3l17 17-1.4 1.4-17-17z"/></svg>
        </button>
      </div>
      </div>
      <div class="controls" id="controls">
        <div class="seek">
          <div class="seek-track"><div class="seek-produced" id="produced"></div></div>
          <input type="range" id="seekBar" min="0" max="1" step="0.1" value="0" aria-label="seek">
        </div>
        <div class="bar">
          <button id="playBtn" class="icon" data-i18n-title="play">
            <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
          </button>
          <button id="backBtn" class="icon text" data-i18n-title="back">−10</button>
          <button id="fwdBtn" class="icon text" data-i18n-title="fwd">+10</button>
          <span id="timeLabel" class="time">0:00 / 0:00</span>
          <span class="av-group">
            <button id="micBtn" class="icon av off" type="button">
              <svg class="i-on" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5.3-3c0 3-2.5 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.4 2.7 6.2 6 6.7V21h2v-3.3c3.3-.5 6-3.3 6-6.7z"/></svg>
              <svg class="i-off" viewBox="0 0 24 24"><path d="M19 11h-1.7c0 .7-.2 1.4-.4 2l1.2 1.3c.6-1 .9-2.1.9-3.3zm-4 .2V5a3 3 0 0 0-6 0v.2zM4.3 3 3 4.3l6 6v.7a3 3 0 0 0 3.7 2.9l1.6 1.7c-.7.3-1.5.5-2.3.5-2.8 0-5.3-2.1-5.3-5.1H5c0 3.4 2.7 6.2 6 6.7V21h2v-3.3c.9-.1 1.8-.4 2.5-.9l4.2 4.2 1.3-1.3z"/></svg>
            </button>
            <button id="micMenuBtn" class="icon caret" type="button" data-i18n-title="mic_settings">
              <svg viewBox="0 0 24 24"><path d="M7 14.5 12 9.5l5 5z"/></svg>
            </button>
            <div class="av-menu" id="micMenu" hidden>
              <label class="field"><span data-i18n="mic_device"></span><select id="micDevice"></select></label>
              <label class="check"><input type="checkbox" id="duckCheck"><span data-i18n="duck_film"></span></label>
            </div>
          </span>
          <span class="av-group">
            <button id="camBtn" class="icon av off" type="button">
              <svg class="i-on" viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11z"/></svg>
              <svg class="i-off" viewBox="0 0 24 24"><path d="M21 6.5l-4 4V7a1 1 0 0 0-1-1H9.8L21 17.2zM3.3 2 2 3.3 4.7 6H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12c.2 0 .4-.1.5-.2l3.2 3.2 1.3-1.3z"/></svg>
            </button>
            <button id="camMenuBtn" class="icon caret" type="button" data-i18n-title="cam_settings">
              <svg viewBox="0 0 24 24"><path d="M7 14.5 12 9.5l5 5z"/></svg>
            </button>
            <div class="av-menu" id="camMenu" hidden>
              <label class="field"><span data-i18n="cam_device"></span><select id="camDevice"></select></label>
              <label class="check"><input type="checkbox" id="selfCheck"><span data-i18n="show_self"></span></label>
              <label class="check"><input type="checkbox" id="camsCheck"><span data-i18n="show_cams"></span></label>
            </div>
          </span>
          <button id="screenBtn" class="icon av screen" type="button">
            <svg viewBox="0 0 24 24"><path d="M3 4h18a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1h-7v2h3v2H7v-2h3v-2H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm1 2v9h16V6zm8 1 3.5 3.5H13V14h-2v-3.5H8.5z"/></svg>
          </button>
          <button id="chatBtn" class="icon chat-btn" type="button" data-i18n-title="chat_open">
            <svg viewBox="0 0 24 24"><path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H10l-5 4v-4H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/></svg>
            <span class="badge" id="chatBadge" hidden></span>
          </button>
          <span class="spacer"></span>
          <button id="muteBtn" class="icon" data-i18n-title="mute">
            <svg class="i-vol" viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
            <svg class="i-muted" viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9zm15.6 3 2.1-2.1-1.4-1.4-2.1 2.1-2.1-2.1-1.4 1.4 2.1 2.1-2.1 2.1 1.4 1.4 2.1-2.1 2.1 2.1 1.4-1.4z"/></svg>
          </button>
          <input type="range" id="volume" class="volume" min="0" max="1" step="0.05" aria-label="volume">
          <button id="pipBtn" class="icon" data-i18n-title="pip" hidden>
            <svg viewBox="0 0 24 24"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 2v10h16V7zm8 4h7v5h-7z"/></svg>
          </button>
          <button id="fsBtn" class="icon" data-i18n-title="fullscreen">
            <svg viewBox="0 0 24 24"><path d="M5 5h5v2H7v3H5zm9 0h5v5h-2V7h-3zM5 14h2v3h3v2H5zm12 3v-3h2v5h-5v-2z"/></svg>
          </button>
        </div>
      </div>
    </div>
    </div>
    <aside class="chat-dock" id="chatDock"></aside>
    </div>

    <div class="cards">
      <section class="card wide share-card" id="shareCard" hidden>
        <div class="share-text">
          <div class="share-head">
            <h2 data-i18n="panel_share"></h2>
            <button type="button" id="settingsBtn" class="ghost" data-i18n="settings_open"></button>
          </div>
          <div class="ts-status" id="tsStatus">
            <span class="light" id="tsLight"></span>
            <span id="tsText"></span>
            <a id="tsLink" class="ts-action" target="_blank" rel="noopener" hidden></a>
            <button type="button" id="tsOpen" class="ghost" data-i18n="ts_open" hidden></button>
            <button type="button" id="shareRetry" class="ghost" data-i18n="share_retry" hidden></button>
          </div>
          <p class="hint" id="tsHint" hidden></p>
          <div class="inline-form" id="friendRow">
            <input id="friendLink" readonly aria-label="link" spellcheck="false">
            <button type="button" id="copyLink" class="primary" data-i18n="share_copy"></button>
          </div>
          <p class="hint" id="shareHint"></p>
        </div>
        <canvas class="qr" id="qrCanvas" hidden></canvas>
      </section>

      <section class="card wide" id="browseCard">
        <div class="browse-head">
          <h2 data-i18n="panel_browse"></h2>
          <select id="catalogSel" aria-label="catalog"></select>
          <form id="browseSearch" class="inline-form browse-search">
            <input id="browseQuery" type="search" data-i18n-placeholder="browse_search" autocomplete="off">
            <button type="submit" data-i18n="browse_search_button"></button>
          </form>
          <button type="button" id="addonsBtn" class="ghost" data-i18n="addons_manage"></button>
        </div>
        <div class="addons-panel" id="addonsPanel" hidden>
          <ul id="addonList" class="addon-list"></ul>
          <form id="addonForm" class="inline-form">
            <input id="addonUrl" data-i18n-placeholder="addons_add_placeholder" autocomplete="off" spellcheck="false">
            <button type="submit" data-i18n="addons_add"></button>
            <button type="button" id="addonsStremio" class="ghost" data-i18n="addons_stremio"></button>
          </form>
          <p class="hint" id="addonsNote" data-i18n="addons_note"></p>
          <p class="hint" id="addonsHostOnly" data-i18n="addons_host_only" hidden></p>
        </div>
        <div id="browseList">
          <div id="browseGrid" class="poster-grid"></div>
          <p class="hint" id="browseStatus"></p>
          <button type="button" id="browseMore" class="ghost" data-i18n="browse_more" hidden></button>
        </div>
        <div id="titleView" class="title-view" hidden>
          <button type="button" id="titleBack" class="ghost" data-i18n="browse_back"></button>
          <div class="title-info">
            <img id="titlePoster" alt="" referrerpolicy="no-referrer">
            <div>
              <h3 id="titleName"></h3>
              <p class="hint" id="titleMeta"></p>
              <p id="titleDesc" class="title-desc"></p>
            </div>
          </div>
          <div id="episodes" hidden>
            <select id="seasonSel" aria-label="season"></select>
            <ul id="episodeList" class="episode-list"></ul>
          </div>
          <h3 id="streamsHead" data-i18n="streams"></h3>
          <p class="hint" data-i18n="streams_hint"></p>
          <div class="stream-tools" id="streamTools" hidden>
            <input id="streamFilter" type="search" data-i18n-placeholder="streams_filter" autocomplete="off" spellcheck="false">
            <select id="streamAddon" aria-label="add-on"></select>
            <div class="chips" id="streamQuality"></div>
          </div>
          <ul id="streamList" class="stream-list"></ul>
          <div class="list-foot">
            <span class="hint" id="streamCount"></span>
            <button type="button" id="streamMore" class="ghost" hidden></button>
          </div>
        </div>
      </section>

      <section class="card" id="mediaCard">
        <h2 data-i18n="panel_media"></h2>
        <form id="magnetForm" class="inline-form">
          <input id="magnetInput" placeholder="magnet:?xt=urn:btih:…" autocomplete="off" spellcheck="false">
          <button type="submit" class="primary" data-i18n="add_torrent"></button>
        </form>
        <div id="fileList" class="file-list" hidden></div>
        <form id="pathForm" class="inline-form" hidden>
          <input id="pathInput" data-i18n-placeholder="local_path" autocomplete="off" spellcheck="false">
          <button type="button" id="pickFileBtn" data-i18n="pick_file"></button>
          <button type="submit" data-i18n="open_file"></button>
        </form>
        <p class="hint" id="hostHint" data-i18n="host_only" hidden></p>
        <p class="hint" id="mediaLockHint" data-i18n="media_trusted_only" hidden></p>
        <div id="libraryBox" hidden>
          <h3 data-i18n="library"></h3>
          <p class="hint" id="libraryHint" hidden></p>
          <input id="libraryFilter" data-i18n-placeholder="library_filter" autocomplete="off" spellcheck="false">
          <div id="libraryList" class="file-list library-list"></div>
        </div>
        <div class="info" id="mediaInfo"></div>
        <div class="info" id="torrentInfo"></div>
        <button id="closeMedia" class="ghost" data-i18n="close_media" hidden></button>
      </section>

      <section class="card" id="subsCard">
        <h2 data-i18n="panel_subs"></h2>
        <div class="grid2">
          <label class="field"><span data-i18n="subs_primary"></span><select id="primarySel"></select></label>
          <label class="field"><span data-i18n="subs_secondary"></span><select id="secondarySel"></select></label>
        </div>
        <div class="field">
          <span data-i18n="subs_offset"></span>
          <div class="offset-row">
            <button type="button" data-off="-500">−0.5</button>
            <button type="button" data-off="-100">−0.1</button>
            <output id="offsetOut">0.0 s</output>
            <button type="button" data-off="100">+0.1</button>
            <button type="button" data-off="500">+0.5</button>
            <button type="button" data-off="reset" class="ghost">0</button>
          </div>
          <p class="hint" data-i18n="offset_hint"></p>
        </div>
        <div class="grid2">
          <label class="field"><span data-i18n="subs_size"></span><input type="range" id="sizeRange" min="60" max="200" step="5"></label>
          <label class="field"><span data-i18n="subs_position"></span><input type="range" id="bottomRange" min="2" max="40" step="1"></label>
        </div>
        <details class="add-subs">
          <summary data-i18n="subs_add"></summary>
          <form id="searchForm" class="inline-form">
            <input id="searchLangs" data-i18n-placeholder="subs_search_langs" autocomplete="off">
            <button type="submit" data-i18n="subs_search"></button>
          </form>
          <p class="hint" id="osOff" hidden><span data-i18n="subs_search_off"></span>
            <a href="https://www.opensubtitles.com/consumers" target="_blank" rel="noopener" data-i18n="os_help"></a></p>
          <div id="addonSubs" class="addon-subs" hidden>
            <div class="inline-form">
              <button type="button" id="addonSubsBtn" data-i18n="subs_addons"></button>
              <select id="addonSubsLang" aria-label="language" hidden></select>
            </div>
            <ul id="addonSubsList" class="track-list"></ul>
            <button type="button" id="addonSubsMore" class="ghost" hidden></button>
          </div>
          <form id="uploadForm" class="inline-form">
            <input type="file" id="subFile" accept=".srt,.ass,.ssa,.vtt,.sub,.txt">
            <input id="subLang" class="short" list="langList" data-i18n-placeholder="subs_upload_lang" autocomplete="off">
            <button type="submit" data-i18n="subs_upload_button"></button>
          </form>
        </details>
        <h3 data-i18n="subs_tracks"></h3>
        <ul id="trackList" class="track-list"></ul>
      </section>
    </div>
  </main>

  <datalist id="langList">
    <option value="tr"></option><option value="en"></option><option value="ru"></option>
    <option value="de"></option><option value="fr"></option><option value="es"></option>
    <option value="it"></option><option value="pt-br"></option><option value="uk"></option>
    <option value="ar"></option><option value="fa"></option><option value="az"></option>
  </datalist>

  <div class="overlay" id="joinOverlay">
    <form class="join-card" id="joinForm">
      <h1>Co<span>·</span>Watch</h1>
      <p class="join-sub" data-i18n="join_title"></p>
      <label class="field"><span data-i18n="join_name"></span><input id="nameInput" maxlength="24" required autocomplete="nickname"></label>
      <label class="field"><span data-i18n="join_lang"></span><select id="joinLang"></select></label>
      <div class="preview" id="preview">
        <video id="previewVideo" autoplay playsinline muted></video>
        <p class="preview-off" data-i18n="preview_off"></p>
        <div class="preview-meter" id="previewMeter" hidden><i></i><i></i><i></i><i></i><i></i></div>
        <div class="preview-btns">
          <button type="button" id="preMicBtn" class="round av off"></button>
          <button type="button" id="preCamBtn" class="round av off"></button>
        </div>
      </div>
      <button type="submit" class="primary big" data-i18n="join_button"></button>
      <p class="hint" data-i18n="join_hint"></p>
      <p class="hint source-link"><a href="https://github.com/erkinavcii/CoWatch" target="_blank" rel="noopener" data-i18n="source_code"></a></p>
    </form>
  </div>

  <div class="overlay settings-overlay" id="settingsOverlay" hidden>
    <form class="settings-card" id="settingsForm" novalidate>
      <div class="share-head">
        <h2 data-i18n="settings_title"></h2>
        <button type="button" id="settingsClose" class="ghost" data-i18n-title="settings_close">✕</button>
      </div>

      <fieldset data-key="connection">
        <legend data-i18n="set_connection"></legend>
        <label class="choice"><input type="radio" name="connection" value="funnel">
          <span><b data-i18n="conn_funnel"></b><small data-i18n="conn_funnel_hint"></small></span></label>
        <label class="choice"><input type="radio" name="connection" value="serve">
          <span><b data-i18n="conn_serve"></b><small data-i18n="conn_serve_hint"></small></span></label>
        <label class="choice"><input type="radio" name="connection" value="http">
          <span><b data-i18n="conn_http"></b><small data-i18n="conn_http_hint"></small></span></label>
      </fieldset>

      <fieldset data-key="quality">
        <legend data-i18n="set_quality"></legend>
        <label class="choice"><input type="radio" name="quality" value="auto">
          <span><b data-i18n="quality_auto"></b><small data-i18n="quality_auto_hint"></small></span></label>
        <label class="choice"><input type="radio" name="quality" value="original">
          <span><b data-i18n="quality_original"></b><small data-i18n="quality_original_hint"></small></span></label>
        <label class="choice"><input type="radio" name="quality" value="manual">
          <span><b data-i18n="quality_manual"></b><small data-i18n="quality_manual_hint"></small></span></label>
        <label class="field mbps"><span data-i18n="quality_mbps"></span>
          <input type="number" id="qualityMbps" min="1" max="200" step="0.5"></label>
      </fieldset>

      <fieldset data-key="libraryDirs">
        <legend data-i18n="set_library"></legend>
        <ul class="dir-list" id="dirList"></ul>
        <div class="inline-form">
          <input id="dirInput" data-i18n-placeholder="library_dir_placeholder" autocomplete="off" spellcheck="false">
          <button type="button" id="dirPick" data-i18n="pick_file"></button>
          <button type="button" id="dirAdd" data-i18n="library_dir_add"></button>
        </div>
      </fieldset>

      <fieldset data-key="mediaControl">
        <legend data-i18n="set_media_control"></legend>
        <label class="choice"><input type="radio" name="mediaControl" value="everyone">
          <span><b data-i18n="media_everyone"></b></span></label>
        <label class="choice"><input type="radio" name="mediaControl" value="trusted">
          <span><b data-i18n="media_trusted"></b><small data-i18n="media_trusted_hint"></small></span></label>
      </fieldset>

      <fieldset>
        <legend>OpenSubtitles</legend>
        <ol class="hint os-steps">
          <li><span data-i18n="os_step1"></span> <a href="https://www.opensubtitles.com" target="_blank" rel="noopener">opensubtitles.com</a></li>
          <li><span data-i18n="os_step2"></span> <a href="https://www.opensubtitles.com/consumers" target="_blank" rel="noopener">opensubtitles.com/consumers</a></li>
          <li data-i18n="os_step3"></li>
        </ol>
        <label class="field" data-key="osApiKey"><span data-i18n="os_api_key"></span><input id="osApiKey" autocomplete="off" spellcheck="false"></label>
        <div class="grid2">
          <label class="field" data-key="osUsername"><span data-i18n="os_username"></span><input id="osUsername" autocomplete="off" spellcheck="false"></label>
          <label class="field" data-key="osPassword"><span data-i18n="os_password"></span><input id="osPassword" type="password" autocomplete="new-password"></label>
        </div>
      </fieldset>

      <details class="advanced">
        <summary data-i18n="set_advanced"></summary>
        <div class="grid2">
          <label class="field" data-key="port"><span data-i18n="set_port"></span><input id="port" type="number" min="1024" max="65535"></label>
          <label class="field" data-key="torrentUploadLimit"><span data-i18n="set_torrent_up"></span><input id="torrentUploadLimit" type="number" min="0"></label>
        </div>
        <label class="field" data-key="iceServers"><span data-i18n="set_ice"></span>
          <input id="iceServers" placeholder="stun:stun.l.google.com:19302" autocomplete="off" spellcheck="false"></label>
        <div class="field">
          <span data-i18n="set_room_key"></span>
          <div><button type="button" id="newKeyBtn" data-i18n="set_new_key"></button></div>
          <p class="hint" data-i18n="set_new_key_hint"></p>
        </div>
      </details>

      <p class="hint warn" id="settingsWarn" hidden></p>
      <div class="settings-actions">
        <button type="button" id="settingsCancel" class="ghost" data-i18n="settings_cancel"></button>
        <button type="submit" id="settingsSave" class="primary" data-i18n="settings_save"></button>
      </div>
    </form>
  </div>

  <div class="peer-pop" id="peerPop" hidden>
    <span id="peerPopName"></span>
    <input type="range" id="peerVol" min="0" max="1" step="0.05">
    <button type="button" id="peerGrant" class="ghost" hidden></button>
    <button type="button" id="peerStopShare" class="ghost" data-i18n="screen_stop_theirs" hidden></button>
    <p class="hint" id="peerGrantHint" data-i18n="grant_hint" hidden></p>
  </div>
  <div id="voices" hidden></div>

  <div class="toasts" id="toasts"></div>

  <script src="/static/vendor/hls.light.min.js"></script>
  <script src="/static/vendor/qrcode.js"></script>
  <script src="/static/i18n.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
